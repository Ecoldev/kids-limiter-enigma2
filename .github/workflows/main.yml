name: Plugin CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: python3 -m py_compile $(git ls-files '*.py')

      - name: Run simple tests
        run: python3 test_time.py